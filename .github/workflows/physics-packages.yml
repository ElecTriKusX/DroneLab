name: Physics packages Windows and Linux

on:
  push:
    branches: [physics-packages, physics-plugins, envieroment-packages]
  pull_request:
    branches: [physics-packages, physics-plugins, envieroment-packages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify committed packages
        run: python Tools/build_unity_packages.py --check
      - name: Python regression tests
        run: python -m unittest discover -s Tests/Python -v
      - name: Mathematical core tests (not Unity PlayMode)
        run: dotnet test Tests/DotNet/DroneLab.Physics.Tests.csproj --configuration Release
      - name: Verify regenerated contract
        run: |
          python Tools/generate_physics_contract.py
          git diff --exit-code -- Assets/DronePhysics/Core/Profiles.Generated.cs Assets/DronePhysics/Resources/DronePhysics/drone-profile.schema.json Assets/DronePhysics/Resources/DronePhysics/environment-profile.schema.json Docs/Physics/PARAMETERS.md
